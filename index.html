<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Catch — a harbour kitchen game</title>
<style>
  /* The game's display face, kept inside game/ like everything the page
     reaches for: Fredoka (SIL Open Font License 1.1), subsetted to the
     glyphs the game draws, in its regular and bold weights. */
  @font-face {
    font-family: 'Fredoka';
    src: url('fonts/fredoka-400.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Fredoka';
    src: url('fonts/fredoka-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16282e; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 8px 44px rgba(0, 0, 0, 0.45); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Daily Catch: run a harbour kitchen — take orders, chop, grill, fry, plate and serve before the tickets time out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
